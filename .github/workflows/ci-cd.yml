name: CI/CD - Epibuilder Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Detect changes in src modules
        id: filter
        run: |
          git fetch origin main
          CHANGED=$(git diff --name-only origin/main ${{ github.sha }})
          echo "Changed files: $CHANGED"

          if echo "$CHANGED" | grep -qE '^src/(web|core|bepipred3)/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push final image
        run: |
          docker buildx build --push \
            -f src/web/Dockerfile \
            -t bioinfoufsc/epibuilder:latest \
            -t bioinfoufsc/epibuilder:${{ github.sha }} \
            src/web