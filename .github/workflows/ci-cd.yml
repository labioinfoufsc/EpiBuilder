name: CI/CD - Epibuilder Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build (bepipred3, core, web, all)"
        required: true
        default: "all"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      bepipred3: ${{ steps.filter.outputs.bepipred3 }}
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - id: filter
        run: |
          BEFORE=${{ github.event.before }}
          AFTER=${{ github.sha }}

          echo "Diff: $BEFORE -> $AFTER"

          CHANGED=$(git diff --name-only $BEFORE $AFTER)

          echo "bepipred3=$(echo "$CHANGED" | grep -q '^src/bepipred3/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "core=$(echo "$CHANGED" | grep -q '^src/core/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "web=$(echo "$CHANGED" | grep -q '^src/web/' && echo true || echo false)" >> $GITHUB_OUTPUT

  build-bepipred3:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.bepipred3 == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'bepipred3' || inputs.service == 'all'))
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: |
          docker buildx build --push \
            -f src/bepipred3/Dockerfile \
            -t bioinfoufsc/bepipred3:${{ github.sha }} \
            -t bioinfoufsc/bepipred3:latest \
            src/bepipred3

  build-core:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.core == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'core' || inputs.service == 'all'))
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: |
          docker buildx build --push \
            -f src/core/Dockerfile \
            -t bioinfoufsc/epibuilder-core:${{ github.sha }} \
            -t bioinfoufsc/epibuilder-core:latest \
            src/core

  build-web:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.web == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'web' || inputs.service == 'all'))
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: |
          docker buildx build --push \
            -f src/web/Dockerfile \
            -t bioinfoufsc/epibuilder:${{ github.sha }} \
            -t bioinfoufsc/epibuilder:latest \
            src/web
