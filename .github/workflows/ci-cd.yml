name: CI/CD - Epibuilder Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      bepipred3: ${{ steps.filter.outputs.bepipred3 }}
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Detect changes in src modules
        id: filter
        run: |
          git fetch origin main
          CHANGED=$(git diff --name-only origin/main ${{ github.sha }})
          echo "Changed files: $CHANGED"

          echo "bepipred3=$(echo "$CHANGED" | grep -q '^src/bepipred3/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "core=$(echo "$CHANGED" | grep -q '^src/core/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "web=$(echo "$CHANGED" | grep -q '^src/web/' && echo true || echo false)" >> $GITHUB_OUTPUT

  build-bepipred3:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.bepipred3 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push bepipred3 image
        run: |
          docker buildx build --push \
            -f src/bepipred3/Dockerfile \
            -t bioinfoufsc/bepipred3:latest \
            src/bepipred3

  build-core:
    needs: [detect-changes, build-bepipred3]
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push core image
        run: |
          docker buildx build --push \
            -f src/core/Dockerfile \
            -t bioinfoufsc/epibuilder-core:latest \
            src/core

  build-web:
    needs: [detect-changes, build-core]
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push web image
        run: |
          docker buildx build --push \
            -f src/web/Dockerfile \
            -t bioinfoufsc/epibuilder:latest \
            src/web